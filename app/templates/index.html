<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Prediction</title>
</head>
<body>
    <h1>Student Performance Prediction</h1>
    <form method="POST">
        <label>Study Hours:</label>
        <input type="number" name="study_hours" required>
        <br><br>

        <label>Attendance:</label>
        <input type="number" name="attendance" required>
        <br><br>

        <label>Previous Marks:</label>
        <input type="number" name="previous_marks" required>
        <br><br>
        <label>Assignments:</label>
        <input type="number" name="assignments" required>
        <br><br>
        <button type="submit">Predict Marks</button>
    </form>
    <a href="/history">
    <button type="button">View Prediction History</button>
</a>
</body>
</html>
