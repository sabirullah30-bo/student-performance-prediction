{% extends "layout.html" %}
{% block title %}
Home - Student Predictor
{% endblock %}
{% block content %}
<div class="card shadow p-4">
    <h2 class="text-center mb-4">
        Student Performance Prediction
    </h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Study Hours</label>
            <input type="number" step="any" name="study_hours" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Attendance</label>
            <input type="number" step="any" name="attendance" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Previous Marks</label>
            <input type="number" step="any" name="previous_marks" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Assignments</label>
            <input type="number" step="any" name="assignments" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">
            Predict Result
        </button>

    </form>

</div>
{% endblock %}
