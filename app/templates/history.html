<!DOCTYPE html>
<html>
<head>
    <title>Prediction History</title>
</head>
<body>
<h2>Prediction History</h2>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Study Hours</th>
        <th>Attendance</th>
        <th>Previous Marks</th>
        <th>Prediction</th>
    </tr>
    {% for row in predictions %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[4] }}</td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
